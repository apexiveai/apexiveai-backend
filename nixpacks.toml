providers = ["python"]

[phases.setup]
nixPkgs = [
  "python312",
  "python312Packages.pip",
  "pkg-config",
  "xorg.libxcb",
  "libxkbcommon",
  "xorg.xcbutilwm",
  "xorg.xcbutil",
  "xorg.xcbutilimage",
  "xorg.xcbutilkeysyms",
  "xorg.xcbutilrenderutil",
  "xorg.xcbutilcursor",
  "xorg.libX11",
  "xorg.libXext",
  "xorg.libXrender",
  "xorg.libSM",
  "xorg.libICE",
  "glib",
  "mesa",
  "fontconfig",
  "freetype",
  "zlib"
]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"